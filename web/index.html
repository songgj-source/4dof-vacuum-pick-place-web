<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자비스</title>
<style>
  /* 모서리 규칙: 카드 16px, 버튼·입력 10px, 상태 칩·정지 버튼은 완전한 둥근 모양 */
  :root {
    --bg: #f3f4f5; --surface: #ffffff; --surface-2: #f7f8f9; --ink: #16191d; --sub: #5b636e; --faint: #8a929c;
    --line: #e3e6ea; --accent: #0f766e; --accent-ink: #ffffff; --accent-soft: #e6f2f1;
    --ok: #16794a; --warn: #9a5b00; --warn-soft: #fff4de; --bad: #c22f26; --bad-soft: #fdecea;
    --shadow: 0 1px 2px rgb(22 25 29 / .05), 0 4px 16px rgb(22 25 29 / .05);
    --mono: "JetBrains Mono", "D2Coding", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1012; --surface: #171a1d; --surface-2: #1d2125; --ink: #e9ecef; --sub: #a1a9b3; --faint: #737c86;
      --line: #2a2f35; --accent: #2bb5a6; --accent-ink: #06201d; --accent-soft: #15302d;
      --ok: #45c486; --warn: #e3a64a; --warn-soft: #33270f; --bad: #ef5d52; --bad-soft: #3a1714;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100dvh; background: var(--bg); color: var(--ink);
         font: 15px/1.55 "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; }
  button, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 10px 16px;
           transition: border-color .16s ease, background-color .16s ease, transform .08s ease; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:active:not(:disabled) { transform: scale(.98); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .primary:hover:not(:disabled) { filter: brightness(1.06); }

  /* 상단 */
  header { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--surface) 88%, transparent);
           backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .bar { max-width: 1240px; margin: 0 auto; height: 68px; padding: 0 24px; display: flex; align-items: center; gap: 14px; }
  .brand { display: flex; flex-direction: column; line-height: 1.2; }
  .brand b { font-size: 18px; letter-spacing: -.02em; }
  .brand span { font-size: 12.5px; color: var(--faint); }
  .pill { font-size: 13px; font-weight: 600; padding: 5px 12px; border-radius: 999px; background: var(--surface-2); color: var(--sub);
          border: 1px solid var(--line); white-space: nowrap; }
  .pill.idle { color: var(--ok); } .pill.busy { color: var(--accent); border-color: var(--accent); } .pill.down { color: var(--bad); }
  .spacer { flex: 1; }
  #settings { padding: 8px 14px; color: var(--sub); }
  #stop { background: var(--bad); border-color: var(--bad); color: #fff; font-weight: 700; padding: 11px 28px; border-radius: 999px;
          letter-spacing: .04em; box-shadow: 0 4px 14px color-mix(in srgb, var(--bad) 35%, transparent); }
  #stop:hover { filter: brightness(1.08); }

  /* 배치 */
  main { max-width: 1240px; margin: 0 auto; padding: 24px; display: grid; gap: 20px;
         grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
  section.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 20px; }
  section h2 { font-size: 15px; font-weight: 700; margin: 0 0 14px; letter-spacing: -.01em; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; padding: 16px; gap: 16px; } .bar { padding: 0 16px; } .brand span { display: none; } }

  /* 메뉴 */
  ol.menu { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .item { width: 100%; display: grid; grid-template-columns: 40px 1fr; align-items: center; column-gap: 14px; text-align: left;
          padding: 10px 14px 10px 10px; background: var(--surface-2); border-color: transparent; }
  .item:hover:not(:disabled) { background: var(--accent-soft); border-color: transparent; }
  .item i { font-style: normal; font-family: var(--mono); font-weight: 700; font-size: 15px; width: 40px; height: 40px; border-radius: 10px;
            display: grid; place-items: center; background: var(--surface); color: var(--accent); border: 1px solid var(--line); }
  .item small { display: block; grid-column: 2; color: var(--sub); font-size: 13px; margin-top: -2px; }
  .item .api { display: block; grid-column: 2; font-family: var(--mono); font-size: 11.5px; color: var(--faint); margin-top: 2px; }
  .doclink { color: var(--sub); font-size: 13.5px; text-decoration: none; padding: 8px 10px; border-radius: 10px; }
  .doclink:hover { color: var(--accent); }
  .sub { display: flex; gap: 8px; flex-wrap: wrap; padding: 10px 0 4px 64px; }
  .sub[hidden] { display: none; }
  select { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); min-width: 140px; }
  @media (max-width: 900px) { .sub { padding-left: 0; } .sub select { flex: 1; } }

  /* 진행 상태 */
  .status-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  #banner { display: none; padding: 12px 14px; border-radius: 10px; background: var(--warn-soft); color: var(--warn); font-weight: 700; margin-bottom: 12px; }
  .now { font-size: 22px; font-weight: 700; letter-spacing: -.02em; margin: 2px 0 2px; }
  .meta { color: var(--sub); font-size: 13.5px; font-variant-numeric: tabular-nums; }
  ol.steps { list-style: none; padding: 0; margin: 16px 0 0; display: grid; gap: 0; }
  ol.steps li { position: relative; display: grid; grid-template-columns: 52px 1fr; gap: 12px; padding: 5px 0 5px 18px; font-size: 14px; color: var(--sub); }
  ol.steps li::before { content: ""; position: absolute; left: 4px; top: 13px; width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
  ol.steps li::after { content: ""; position: absolute; left: 7.5px; top: 23px; bottom: -11px; width: 1px; background: var(--line); }
  ol.steps li:last-child::after { display: none; }
  ol.steps li .t { font-family: var(--mono); font-size: 12px; color: var(--faint); text-align: right; padding-top: 2px; }
  ol.steps li.cur { color: var(--ink); font-weight: 700; }
  ol.steps li.cur::before { background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .result { margin-top: 16px; padding: 12px 14px; border-radius: 10px; font-size: 14px; font-weight: 600; }
  .result.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, transparent); }
  .result.bad { color: var(--bad); background: var(--bad-soft); }
  .warn { color: var(--warn); font-size: 13px; margin-top: 8px; }

  .side { display: grid; gap: 20px; align-content: start; }
  .status-card { min-height: 220px; }
  .status-head { align-items: center; }
  .status-head h2 { margin: 0; }
  .cam-api { display: block; font-family: var(--mono); font-size: 11.5px; color: var(--faint); margin: 2px 0 12px; }
  .snap { display: block; width: 100%; max-width: 420px; border-radius: 10px; margin-bottom: 8px; cursor: zoom-in; border: 1px solid var(--line); }
  .snap.big { max-width: 100%; cursor: zoom-out; }
  .msg.has-photo { max-width: 100%; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 8px; }
  .chip { font-size: 13px; padding: 4px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); }
  .chip.far { color: var(--faint); }
  .chip.unknown { border-style: dashed; }
  .snap-time { display: block; color: var(--faint); font-size: 12px; margin-bottom: 6px; }
  #look { padding: 7px 12px; font-size: 13.5px; }
  .notice { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); color: var(--sub); font-size: 13.5px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  /* 말로 시키기 */
  .col { display: grid; gap: 20px; align-content: start; }
  .log { display: grid; gap: 8px; max-height: min(64vh, 720px); min-height: 260px; overflow-y: auto; padding: 2px 2px 10px; align-content: start; }
  .log .hint { margin: 0; color: var(--faint); font-size: 13.5px; }
  .msg { max-width: 88%; padding: 9px 13px; border-radius: 12px; font-size: 14.5px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user { justify-self: end; background: var(--accent-soft); color: var(--ink); }
  .msg.bot { justify-self: start; background: var(--surface-2); border: 1px solid var(--line); }
  .msg.wait { color: var(--faint); }
  .msg.err { color: var(--bad); background: var(--bad-soft); border-color: transparent; }
  .msg ul.actions { margin: 8px 0 0; padding-left: 18px; display: grid; gap: 3px; font-size: 13.5px; color: var(--sub); }
  .msg .go-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
  .chat-form { display: flex; gap: 8px; margin-top: 4px; }
  .chat-form input { flex: 1; min-width: 0; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); }
  #mic { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  #mic svg { width: 16px; height: 16px; }
  #mic.on { background: var(--bad); border-color: var(--bad); color: #fff; }
  .voice-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 8px; font-size: 13px; color: var(--sub); }
  .voice-row label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  #voice-state { color: var(--faint); }
  #voice-engine { min-width: 0; padding: 6px 10px; font-size: 13px; }
  #voice-state.live { color: var(--bad); font-weight: 600; }
  @media (prefers-reduced-motion: no-preference) { #mic.on { animation: pulse 1.2s ease-in-out infinite; } @keyframes pulse { 50% { filter: brightness(1.25); } } }

  /* 창 */
  dialog { border: 1px solid var(--line); border-radius: 16px; background: var(--surface); color: var(--ink); padding: 22px; max-width: 400px; width: calc(100% - 32px); box-shadow: 0 20px 60px rgb(0 0 0 / .25); }
  dialog::backdrop { background: rgb(10 12 14 / .45); }
  dialog p { margin: 0 0 18px; }
  dialog label { display: block; font-size: 13px; color: var(--sub); margin-bottom: 6px; }
  dialog input { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); margin-bottom: 16px; }

  /* 로그창: 작업·오류의 원문 이유를 본다 */
  .logcard { grid-column: 1 / -1; }
  .log-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .log-head h2 { margin: 0; }
  .log-head .count { font-size: 12.5px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--bad-soft); color: var(--bad); }
  .log-head .count[hidden] { display: none; }
  .log-head select { padding: 7px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); }
  .log-head button { padding: 7px 12px; font-size: 13.5px; }
  #log-list { max-height: 340px; overflow: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2);
              font: 12.5px/1.5 var(--mono); }
  #log-list .empty { padding: 18px; color: var(--faint); font-family: inherit; }
  .lg { display: block; border-bottom: 1px solid var(--line); }
  .lg:last-child { border-bottom: 0; }
  .lg > summary, .lg > .row { list-style: none; display: grid; grid-template-columns: 4.6em 3.2em minmax(6em, 10em) minmax(0, 1fr); gap: 10px; padding: 7px 12px; align-items: baseline; }
  .lg > summary::-webkit-details-marker { display: none; }
  .lg > summary { cursor: pointer; }
  .lg > summary:hover { background: color-mix(in srgb, var(--accent) 6%, transparent); }
  .lg .t { color: var(--faint); font-variant-numeric: tabular-nums; }
  .lg .lv { font-weight: 700; }
  .lg .src { color: var(--sub); overflow-wrap: anywhere; }
  .lg .msg { overflow-wrap: anywhere; white-space: pre-wrap; }
  .lg > summary .msg::after { content: " ▸"; color: var(--faint); }
  .lg[open] > summary .msg::after { content: " ▾"; }
  .lg pre { margin: 0; padding: 8px 12px 12px calc(4.6em + 3.2em + 10em + 42px); color: var(--sub); white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; }
  .lg.lv-ok .lv { color: var(--ok); } .lg.lv-warn .lv { color: var(--warn); } .lg.lv-error .lv { color: var(--bad); }
  .lg.lv-error { background: var(--bad-soft); } .lg.lv-warn { background: color-mix(in srgb, var(--warn-soft) 70%, transparent); }
  #log-list[data-filter="warn"] .lg.lv-info, #log-list[data-filter="warn"] .lg.lv-ok { display: none; }
  #log-list[data-filter="error"] .lg:not(.lv-error) { display: none; }
  @media (max-width: 700px) {
    .lg > summary, .lg > .row { grid-template-columns: 4.4em 2.8em minmax(0, 1fr); }
    .lg .src { display: none; }
    .lg pre { padding-left: 12px; }
  }
  .doclink .count { margin-left: 6px; font-size: 11.5px; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: var(--bad); color: #fff; }
  .doclink .count[hidden] { display: none; }

  @media (prefers-reduced-motion: no-preference) {
    .notice:not([hidden]) { animation: rise .22s cubic-bezier(.16, 1, .3, 1); }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  }
</style>
</head>
<body>
<header><div class="bar">
  <div class="brand"><b>자비스</b><span>SO-101 진공흡착 로봇팔 · 물체 분류</span></div>
  <span id="state" class="pill">연결 중</span>
  <span id="home" class="pill" hidden></span>
  <span class="spacer"></span>
  <a class="doclink" href="/docs" target="_blank" rel="noopener">API 설명</a>
  <a class="doclink" href="#logcard" title="작업·오류 로그로 이동">로그<span id="log-badge" class="count" hidden>0</span></a>
  <button id="settings" title="접속 토큰">설정</button>
  <button id="stop" title="실행 중인 동작을 즉시 멈춥니다">정지</button>
</div></header>

<main>
    <div class="col">
    <section class="card chat">
      <div class="status-head"><h2>말로 시키기</h2><button id="look" title="위 카메라로 다시 찍고 상황을 알려 줍니다">다시 보기</button></div>
      <code class="api cam-api">POST /api/situation · /chat · 로컬 LLM(Ollama)</code>
      <div id="log" class="log" aria-live="polite"><p class="hint">화면을 열면 먼저 책상을 찍어 상황과 할 수 있는 일을 알려 드립니다. 잠시 기다려 주세요.</p></div>
      <form id="chat-form" class="chat-form"><input id="chat-in" maxlength="500" placeholder="명령을 입력하거나 [말하기]를 누르세요 (바로 실행됩니다)" autocomplete="off" aria-label="명령">
        <button type="button" id="mic" title="누르고 말하세요. 예: 자비스, 빨간 큐브 넣어줘 / 실행 / 멈춰"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>말하기</button>
        <button id="chat-send" class="primary">보내기</button></form>
      <div class="voice-row"><span id="voice-state">음성: 대기</span>
        <span class="row"><select id="voice-engine" aria-label="음성 인식 방식"><option value="local">로컬 인식(Whisper)</option><option value="browser">브라우저 인식(구글)</option></select>
        <label><input type="checkbox" id="speak-on" checked> 로봇 목소리</label></span></div>
    </section>
    </div>

    <div class="side">

    <section class="card status-card">
      <div class="status-head"><h2>진행 상태</h2></div>
      <div id="banner"></div>
      <div class="now" id="now">대기 중</div>
      <div class="meta" id="meta">명령을 기다리고 있습니다.</div>
      <ol class="steps" id="steps"></ol>
      <div id="result"></div>
      <div id="notice" class="notice" hidden></div>
    </section>

    <section class="card">
      <h2>메뉴</h2>
      <ol class="menu">
        <li><button class="item" data-run="white_box"><i>1</i>흰 상자 → 1번 칸<code class="api">POST /api/menu/1</code></button></li>
        <li><button class="item" data-run="red_cube"><i>2</i>빨간 정육면체 → 2번 칸<code class="api">POST /api/menu/2</code></button></li>
        <li><button class="item" data-run="tape_measure"><i>3</i>줄자 → 3번 칸<code class="api">POST /api/menu/3</code></button></li>
        <li><button class="item" data-run="all"><i>4</i>세 물체 모두 넣기<small>흰 상자 → 정육면체 → 줄자 순서</small><code class="api">POST /api/menu/4</code></button></li>
        <li><button class="item" data-open="pick5"><i>5</i>물체와 칸을 골라서 넣기<code class="api">POST /api/menu/5</code></button>
          <div class="sub" id="pick5" hidden>
            <select id="obj" aria-label="물체">
              <option value="" selected disabled>물체 선택</option>
              <option value="white_box">흰 상자</option><option value="red_cube">빨간 정육면체</option><option value="tape_measure">줄자</option>
            </select>
            <select id="slot" aria-label="칸"><option value="" selected disabled>칸 선택</option><option value="1">1번 칸</option><option value="2">2번 칸</option><option value="3">3번 칸</option></select>
            <button id="custom" class="primary">넣기</button>
          </div></li>
        <li><button class="item" data-run="home"><i>6</i>HOME으로 복귀<code class="api">POST /api/menu/6</code></button></li>
        <li><button class="item" data-open="pick7"><i>7</i>unknown 자동 집기<small>시작 후 새 물체 하나 놓기</small><code class="api">POST /api/menu/7</code></button>
          <div class="sub" id="pick7" hidden>
            <select id="uslot" aria-label="놓을 칸"><option value="" selected disabled>놓을 칸 선택</option><option value="1">1번 칸</option><option value="2">2번 칸</option><option value="3">3번 칸</option></select>
            <button id="unknown" class="primary">시작</button>
          </div></li>
      </ol>
    </section>
    </div>

    <section class="card logcard" id="logcard">
      <div class="log-head">
        <h2>로그</h2><span id="log-count" class="count" hidden>0</span>
        <span class="spacer"></span>
        <select id="log-filter" aria-label="로그 보기"><option value="all">전체</option><option value="warn">주의·오류</option><option value="error">오류만</option></select>
        <button id="log-copy" type="button">복사</button>
        <button id="log-clear" type="button">비우기</button>
        <button id="log-fold" type="button" aria-expanded="true">접기</button>
      </div>
      <div id="log-list" data-filter="all" role="log" aria-live="off"><div class="empty">기록을 불러오는 중…</div></div>
    </section>

</main>

<dialog id="confirm"><p id="confirm-text"></p>
  <div class="row" style="justify-content:flex-end"><button value="no" id="confirm-no">취소</button><button class="primary" id="confirm-yes">실행</button></div>
</dialog>
<dialog id="token"><p>다른 장비에서 접속할 때 서버를 켤 때 정한 <code>--token</code> 값을 넣습니다. 같은 장비라면 비워 두세요.</p>
  <label for="token-in">접속 토큰</label>
  <input id="token-in" type="password" autocomplete="off">
  <div class="row" style="justify-content:flex-end"><button id="token-save" class="primary">저장</button></div>
</dialog>

<script>
const NAMES = { white_box: '흰 상자', red_cube: '빨간 정육면체', tape_measure: '줄자', unknown: '새 물체' };
const DEFAULT_SLOT = { white_box: 1, red_cube: 2, tape_measure: 3, unknown: 3 };
const REASONS = {
  object_not_found: '물체를 찾지 못했습니다.', slot_too_small: '칸에 들어갈 여유가 부족합니다.', unreachable: '팔이 닿지 않는 위치입니다.',

  if (cmd.action === 'pick_all') return '세 물체를 모두 넣습니다(흰 상자 → 정육면체 → 줄자, 책상에 없는 것은 건너뜀).';
  if (cmd.object === 'unknown') return `새 물체를 ${cmd.slot}번 칸에 넣습니다. 시작 후 안내가 나오면 물체를 놓아 주세요.`;

const chatHistory = [];
function bubble(cls, text) {

  $('log').appendChild(d); $('log').scrollTop = $('log').scrollHeight; return d;

function toRun(p) {          // 제안을 메뉴 번호 실행으로 바꾼다(버튼과 같은 길)
  if (p.action === 'return_home') return RUN.home;
  if (p.action === 'pick_all') return p.objects ? { ...RUN.all, objects: p.objects } : RUN.all;
  if (p.object === 'unknown') return { menu: 7, action: 'pick_place', object: 'unknown', slot: p.slot };
  if (p.slot == null) return RUN[p.object];

let pending = null;          // 대답을 기다리는 제안 { cmd, button }

}

// 상황 파악: 사진 → 책상 상황·할 수 있는 일·기본 제안(책상 정리) → 입력을 기다린다. 화면을 열 때, 작업이 끝날 때마다, [다시 보기].
let looking = false;
async function lookAround() {

  const wait = bubble('bot wait', '책상을 찍어 상황을 확인하는 중…');
  try {
    const { status, data } = await api('POST', '/api/situation', {});
    wait.remove();
    if (status !== 200) { bubble('bot err', REASONS[data.reason_code] || data.reason || ('오류 ' + status)); return; }
    const msg = bubble('bot', data.reply);
    if (data.scene) showScene(data.scene, msg);
    if (data.actions && data.actions.length) {
      const list = document.createElement('ul'); list.className = 'actions';
      data.actions.forEach((a) => { const li = document.createElement('li'); li.textContent = a; list.appendChild(li); });
      msg.insertBefore(list, null);

    chatHistory.push({ role: 'assistant', content: data.reply });
    speak(data.speech || data.reply, false);

  finally { looking = false; }

async function sendChat(text) {

  $('chat-send').disabled = true;
  try {
    const { status, data } = await api('POST', '/chat', { history: chatHistory.slice(-20), text });
    wait.remove();
    if (status !== 200) { const m = data.reason || REASONS[data.reason_code] || ('오류 ' + status); bubble('bot err', m); speak(m); return; }
    chatHistory.push({ role: 'user', content: text });

    bubble('user', t);

    const m = data.stopped ? '정지 명령을 보냈습니다.' : '실행 중인 동작이 없습니다.';

  }
});
$('stop').onclick = async () => { const { data } = await api('POST', '/stop', {}); say('sys', data.stopped ? '정지 요청을 보냈습니다.' : '실행 중인 동작이 없습니다.'); poll(); };
$('settings').onclick = () => { $('token-in').value = token; $('token').showModal(); };
$('token-save').onclick = () => { token = $('token-in').value.trim(); try { localStorage.setItem('armToken', token); } catch (e) {} $('token').close(); poll(); };

// ---------- 상태 ----------
function setBusy(b) {
  busy = b; document.querySelectorAll('.item, #custom, #unknown, #look').forEach((el) => el.disabled = b);
}
async function poll() {
  let res; try { res = await api('GET', '/status'); } catch (e) { $('state').className = 'pill down'; $('state').textContent = '서버 연결 끊김'; return; }
  if (res.status === 401) { $('state').className = 'pill down'; $('state').textContent = '토큰 필요(설정)'; return; }
  const s = res.data; setBusy(s.state === 'busy');
  if (!looked && s.state === 'idle') { looked = true; lookAround(); }       // 화면을 열면 먼저 책상을 찍어 상황을 알린다
  $('state').className = 'pill ' + (s.state === 'busy' ? 'busy' : 'idle');
  $('state').textContent = s.state === 'busy' ? '실행 중' : '대기 중';
  $('home').hidden = s.arm_home == null; $('home').textContent = s.arm_home ? 'HOME 자세' : '';
  const waiting = s.phase === 'unknown_wait';
  $('banner').style.display = waiting ? 'block' : 'none';
  $('banner').textContent = waiting ? '새 물체 하나를 작업 영역에 놓고 손을 빼 주세요 (90초 대기)' : '';
  if (s.task_id) {
    const t = await api('GET', '/tasks/' + s.task_id);
    if (t.status === 200) render(t.data, s);
  }
}
// ---------- 로봇 목소리: 진행 알림 ----------
// 이 화면이 열려 있는 동안 실행 중이었던 작업만 알린다(화면·음성·NOMI 어디서 시작했든). 페이지를 열 때 이미 끝난 작업은 말하지 않는다.
const seenRunning = new Set(), told = {};
function announce(task) {
  if (task.state === 'running') seenRunning.add(task.id);
  if (!seenRunning.has(task.id)) return;
  const t = told[task.id] || (told[task.id] = { step: null, waitSaid: false, done: false });
  if (task.state === 'running') {
    let step = null, line = null;
    if (task.phase === 'unknown_wait') {
      if (!t.waitSaid) { t.waitSaid = true; speak('새 물체 하나를 작업 영역에 놓고 손을 빼 주세요.', false); }
      return;
    }
    if (task.skill === 'pick_all') {
      if (task.phase === 'plan') { step = 'plan'; line = '책상의 물체 위치를 확인합니다.'; }
      else if (task.item && task.phase) { step = 'item:' + task.item; line = `${NAMES[task.item]}를 ${DEFAULT_SLOT[task.item]}번 칸에 넣습니다.`; }
    } else if (task.skill === 'return_home') { step = 'home'; line = 'HOME 자세로 돌아갑니다.'; }
    else if (task.params && task.params.object) { step = 'pick'; line = task.params.object === 'unknown' ? '새 물체를 넣을 준비를 합니다.' : `${NAMES[task.params.object]}를 ${task.params.slot}번 칸에 넣습니다.`; }
    if (step && t.step !== step && !(step === 'plan' && t.step)) { t.step = step; speak(line, false); }
  } else if (task.result && !t.done) {
    t.done = true;
    const r = task.result;
    if (r.ok) speak((task.skill === 'pick_all' ? '책상 정리를 마쳤습니다.' : task.skill === 'return_home' ? 'HOME으로 돌아왔습니다.' : '넣었습니다.') + (r.note ? ' ' + r.note : ''), false);
    else if (r.reason_code === 'cancelled') speak('멈췄습니다.', false);
    else speak('멈췄습니다. ' + (r.reason || REASONS[r.reason_code] || '원인을 확인해 주세요.'), false);
    if (r.reason_code !== 'cancelled') setTimeout(lookAround, 1500);        // 끝나면 다시 책상을 찍어 다음에 할 일을 알린다(멈춤 뒤에는 기다린다)
  }
}
function render(task, s) {
  announce(task);
  const label = task.skill === 'return_home' ? 'HOME 복귀' : task.skill === 'pick_all' ? (task.params && task.params.objects ? '책상 정리 (' + task.params.objects.map((o) => NAMES[o]).join(', ') + ')' : '세 물체 모두 넣기')
              : `${NAMES[task.params.object] || ''} → ${task.params.slot}번 칸`;
  $('now').textContent = task.state === 'running' ? (task.phase_label || '카메라로 위치를 찾는 중') : label;
  $('meta').textContent = task.state === 'running' ? `${label} · ${Math.round(s.elapsed_s || 0)}초` : `${label} · ${task.seconds}초`;
  $('steps').innerHTML = '';
  task.phases.forEach((p, i) => {
    const li = document.createElement('li'); if (task.state === 'running' && i === task.phases.length - 1) li.className = 'cur';
    li.innerHTML = `<span class="t">${p.at_s.toFixed(1)}s</span><span></span>`; li.lastChild.textContent = p.label; $('steps').appendChild(li);
  });
  const box = $('result'); box.innerHTML = '';
  if (task.result) {
    const r = task.result, div = document.createElement('div');
    div.className = 'result ' + (r.ok ? 'ok' : 'bad');
    div.textContent = r.ok ? '완료' + (r.note ? ' (' + r.note + ')' : '') : '실패: ' + (REASONS[r.reason_code] || '알 수 없는 오류') + (r.reason ? ' (' + r.reason + ')' : '');
    box.appendChild(div);
    (r.warnings || []).forEach((w) => { const d = document.createElement('div'); d.className = 'warn'; d.textContent = '주의: ' + w; box.appendChild(d); });
    if (task.id === watched && lastShown !== task.id) { lastShown = task.id; say('sys', ''); }   // 끝나면 '…하는 중' 안내를 지운다(결과는 위 칸)
  }
}

// ---------- 로그창 ----------
// 서버가 모아 둔 사건 기록(GET /api/logs)을 2초마다 받아 아래에 붙인다. 줄을 누르면 원문 이유와 실행 프로그램의 마지막 출력이 펼쳐진다.
const LOG_LEVELS = { info: '정보', ok: '완료', warn: '주의', error: '오류' }, LOG_KEEP = 400;
let logLast = 0, logBoot = null, logErrors = 0, logPolling = false;
function logRow(entry) {
  const row = document.createElement(entry.detail ? 'details' : 'div');
  row.className = 'lg lv-' + entry.level;
  const head = document.createElement(entry.detail ? 'summary' : 'div');
  if (!entry.detail) head.className = 'row';
  for (const [cls, text] of [['t', entry.time], ['lv', LOG_LEVELS[entry.level] || entry.level], ['src', entry.source], ['msg', entry.message]]) {
    const cell = document.createElement('span'); cell.className = cls; cell.textContent = text; head.appendChild(cell);
  }
  row.appendChild(head);
  if (entry.detail) { const pre = document.createElement('pre'); pre.textContent = entry.detail; row.appendChild(pre); }
  return row;
}
function showLogErrors() {
  for (const id of ['log-count', 'log-badge']) { $(id).hidden = !logErrors; $(id).textContent = id === 'log-count' ? `오류 ${logErrors}` : logErrors; }
}
async function pollLogs(fresh = false) {
  if (logPolling || document.hidden) return;
  logPolling = true;
  try {
    const { status, data } = await api('GET', '/api/logs?since=' + logLast);
    if (status !== 200) return;
    const list = $('log-list');
    if (logBoot !== null && data.boot !== logBoot && !fresh) {          // 서버를 다시 켰다: 번호가 처음부터 다시 시작한다
      logBoot = data.boot; logLast = 0; logErrors = 0; list.textContent = ''; showLogErrors(); logPolling = false; return pollLogs(true);
    }
    logBoot = data.boot; logLast = data.last;
    if (!data.entries.length) { if (!list.children.length) list.innerHTML = '<div class="empty">아직 기록이 없습니다. 작업을 시키면 여기에 시작·완료·실패 이유가 쌓입니다.</div>'; return; }
    const empty = list.querySelector('.empty'); if (empty) empty.remove();
    const atEnd = list.scrollHeight - list.scrollTop - list.clientHeight < 40;
    for (const entry of data.entries) { list.appendChild(logRow(entry)); if (entry.level === 'error') logErrors += 1; }
    while (list.children.length > LOG_KEEP) list.firstChild.remove();
    showLogErrors();
    if (atEnd) list.scrollTop = list.scrollHeight;
  } catch (e) { /* 서버가 잠깐 안 닿으면 다음 번에 다시 */ } finally { logPolling = false; }
}
$('log-filter').onchange = () => { $('log-list').dataset.filter = $('log-filter').value; try { localStorage.setItem('logFilter', $('log-filter').value); } catch (e) {} };
try { const f = localStorage.getItem('logFilter'); if (f) { $('log-filter').value = f; $('log-list').dataset.filter = $('log-filter').value; } } catch (e) {}
$('log-clear').onclick = () => { $('log-list').innerHTML = '<div class="empty">비웠습니다. 새 기록부터 보입니다.</div>'; logErrors = 0; showLogErrors(); };   // logLast는 그대로 둬서 지운 기록이 다시 오지 않는다
$('log-fold').onclick = () => {
  const open = $('log-list').hidden; $('log-list').hidden = !open; $('log-fold').textContent = open ? '접기' : '펼치기'; $('log-fold').setAttribute('aria-expanded', String(open));
  try { localStorage.setItem('logOpen', open ? '1' : '0'); } catch (e) {}
};
try { if (localStorage.getItem('logOpen') === '0') $('log-fold').click(); } catch (e) {}
$('log-copy').onclick = async () => {
  const text = [...$('log-list').querySelectorAll('.lg')].filter((r) => r.offsetParent !== null).map((r) => {
    const cells = [...r.querySelectorAll(':scope > .row > span, :scope > summary > span')].map((c) => c.textContent).join('  ');
    const pre = r.querySelector('pre'); return cells + (pre ? '\n' + pre.textContent : '');
  }).join('\n');
  const done = () => { $('log-copy').textContent = '복사됨'; setTimeout(() => { $('log-copy').textContent = '복사'; }, 1400); };
  try { await navigator.clipboard.writeText(text); done(); } catch (e) {
    const area = document.createElement('textarea'); area.value = text; document.body.appendChild(area); area.select();
    try { document.execCommand('copy'); done(); } catch (err) { /* 선택만 남는다 */ } area.remove();
  }
};
setInterval(pollLogs, 2000); pollLogs();
setInterval(poll, 1000); poll();

</script>
